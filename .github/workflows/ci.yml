name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  NX_NO_CLOUD: "true"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lastro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lastro_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/api/tools.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Lint, test, build and check generated code of affected projects
        if: github.event_name != 'schedule'
        run: pnpm nx affected -t lint test build sqlc-check --output-style=static

      - name: Scan dependencies for known vulnerabilities
        run: pnpm nx run-many -t vulncheck --output-style=static

  deploy:
    name: deploy
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the API changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git diff --quiet "${BEFORE}" "${GITHUB_SHA}" -- apps/api; then
            echo "api=false" >> "${GITHUB_OUTPUT}"
          else
            echo "api=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy the tested commit to Railway
        if: steps.changes.outputs.api == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
        run: .github/scripts/railway-deploy.sh
