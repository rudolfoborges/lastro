name: lastro

x-api-dev: &api-dev
  build:
    context: apps/api
    target: dev
  environment:
    LASTRO_ENV: development
    DATABASE_URL: postgres://postgres:postgres@postgres:5432/lastro?sslmode=disable
    LOG_LEVEL: debug
  volumes:
    - ./apps/api:/src
    - go-mod-cache:/go/pkg/mod
    - go-build-cache:/root/.cache/go-build

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lastro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lastro"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api-dev
    command: ["go", "run", "./cmd/lastro", "migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-dev
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:2.10.1
    profiles: ["tools"]
    ports:
      - "127.0.0.1:${MCP_INSPECTOR_PORT:-6274}:6274"
    depends_on:
      api:
        condition: service_started

  pgweb:
    image: sosedoff/pgweb:0.17.0
    profiles: ["tools"]
    environment:
      PGWEB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/lastro?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  go-mod-cache:
  go-build-cache:
